name: geo_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip

  # Core geospatial/data stack
  - geopandas
  - gdal
  - rasterio
  - fiona
  - shapely
  - pyproj
  - pyogrio
  - rtree
  - rasterstats
  - rio-vrt
  - geotiff

  # Analysis and visualization
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - statsmodels
  - matplotlib
  - seaborn
  - folium
  - osmnx
  - networkx
  - dask
  - zarr
  - xarray
  - pyarrow

  # Spatial-analysis packages
  - pysal
  - esda
  - libpysal
  - giddy
  - inequality
  - mapclassify
  - mgwr
  - momepy
  - pointpats
  - segregation
  - spaghetti
  - spglm
  - spint
  - splot
  - spopt
  - spreg
  - spvcm
  - tobler

  # Earth observation / cloud
  - earthengine-api
  - odc-geo
  - odc-loader
  - odc-stac
  - pystac

  # Notebook tools
  - jupyterlab
  - ipykernel
  - ipywidgets

  - pip:
      - aiohttp-retry==2.8.3
      - aiolimiter==1.1.0
      - contextily==1.6.2
      - geoalchemy2==0.15.1
      - geocube==0.5.2
      - geojson==3.1.0
      - geojson-pydantic==1.1.0
      - geonetworkx==0.5.3
      - geopy==2.4.1
      - mercantile==1.2.1
      - openpyxl==3.1.5
      - osmium==4.0.2
      - overpass==0.7
      - plotly==5.24.1
      - psycopg2==2.9.9
      - pulp==2.9.0
      - pyreadstat==1.2.7
      - pystac-client==0.8.5
      - rioxarray==0.15.5
      - selenium==4.23.1
      - sqlalchemy==2.0.30
      - staticmap==0.5.7
      - traveltimepy==3.9.11